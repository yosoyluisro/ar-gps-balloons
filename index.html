<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Dibuja en el Aire · Galería AR</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud" class="hidden">
    <header class="hud-top">
      <h1>✒️ Dibuja en el Aire</h1>
      <span id="mode-badge" class="badge">DIBUJAR</span>
    </header>

    <section id="panel-draw" class="panel panel-draw">
      <div id="palette" class="palette"></div>
      <div class="row">
        <button id="btn-draw" class="btn" title="Encender/apagar dibujo (modo 3D)">✏️ OFF</button>
        <button id="btn-undo" class="btn" title="Deshacer último trazo">↶</button>
        <button id="btn-clear" class="btn" title="Limpiar todo">✕</button>
        <button id="btn-save" class="btn btn-accent" title="Guardar en la galería">💾 Guardar</button>
        <button id="btn-gallery" class="btn" title="Ver galería">🖼</button>
      </div>
    </section>

    <section id="panel-gallery" class="panel panel-gallery hidden">
      <div class="row">
        <button id="btn-back" class="btn">← Dibujar</button>
        <button id="btn-view-all" class="btn btn-accent" title="Ver todos en AR">Ver en AR</button>
        <button id="btn-export" class="btn" title="Exportar respaldo JSON">⤓</button>
        <button id="btn-import" class="btn" title="Importar JSON">⤒</button>
      </div>
      <div id="gallery-list" class="gallery-list"></div>
    </section>
  </div>

  <div id="overlay-start">
    <div class="card">
      <div class="logo">✒️</div>
      <h2>Dibuja en el Aire</h2>
      <p>Galería 3D en realidad aumentada. Mantén el dedo presionado para dibujar trazos flotantes en el aire y guárdalos para verlos de nuevo.</p>
      <div id="enter-ar"></div>
      <button id="btn-preview3d" class="btn ghost">Probar en 3D (escritorio)</button>
      <p id="xr-status" class="status"></p>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="card">
      <h3>Guardar dibujo</h3>
      <input id="input-name" type="text" maxlength="30" placeholder="Nombre del dibujo" autocomplete="off">
      <div class="row">
        <button id="btn-modal-ok" class="btn btn-accent">Guardar</button>
        <button id="btn-modal-cancel" class="btn">Cancelar</button>
      </div>
    </div>
  </div>

  <input id="import-file" type="file" accept="application/json,.json" class="hidden">
  <div id="toast" class="toast hidden"></div>

  <div id="depth-ui" class="depth-ui hidden">
    <label>Profundidad: <output id="depth-val">1.8</output> m</label>
    <input id="depth-slider" type="range" min="0.4" max="8" step="0.1" value="1.8">
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
