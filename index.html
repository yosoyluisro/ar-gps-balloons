<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR Balloons</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%88%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?vc=21">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="overlay-start">
    <div class="card">
      <span class="badge">NUEVA VERSION</span>
      <div class="logo">🎈</div>
      <h1>AR Balloons</h1>
      <p>Apunta con la cámara a una superficie, pulsa Agregar globo y deja tu etiqueta flotando en ese lugar.</p>
      <div id="enter-ar"></div>
      <p id="count" class="status"></p>
      <div id="qr"></div>
      <p id="version" class="status"></p>
    </div>
  </div>

  <div id="overlay">
    <div id="hud-bottom">
      <button id="btn-add" type="button">Agregar globo</button>
      <div id="overlay-label" class="hidden">
        <p>Nombre para este globo</p>
        <input id="label-input" type="text" maxlength="22" autocomplete="off" enterkeyhint="done">
        <button id="label-ok" type="button">Aceptar</button>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="module" src="app.js?v=21"></script>
</body>
</html>
